<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screener.in</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="logo">screener<span class="green">.in</span>
      <span class="bar"></span>
      <span class="bar2"></span>
      <span class="bar3"></span>
    </div>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Screens</a></li>
        <li><a href="#">Tools</a></li>
      </ul>
    </nav>
    <div class="auth-buttons">
      <button class="login-btn">Login</button>
      <button class="signup-btn">Get New Account</button>
    </div>

  </header>

  <section class="hero">
    <h2>Stock analysis and screening tool for investors around the World.</h2>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="🔍 Enter company name or stock symbol" />
      <button id="searchBtn">Search</button>
    </div>
      <div class="popular-tags">
        <p>Or Analyse:</p>
        <div class="tag-list">
          <div class="tag-list">
            <button>TCS</button>
            <button>Reliance</button>
            <button>Infosys</button>
            <button>HDFC Bank</button>
            <button>BEL</button>
            <button>Tata Motors</button>
            <button>Adani Enterprises</button>
            <button>IRCTC</button>
            <button>ITC</button>
            <button>Apple</button>
            <button>Microsoft</button>
            <button>Google</button>
            <button>Amazon</button>
            <button>Nvidia</button>
            <button>Meta</button>
            <button>Tesla</button>
            <button>Netflix</button>
            <button>Samsung</button>
            <button>AMD</button>
            <button>Johnson & Johnson</button>
          </div>
          
        </div>
      </div>
      
    </div>
  </section>
  <section class="metrics-section" id="metricsSection">
  </section>
  <footer>
    <div class="footer-left">
      <div class="footer-logo">screener.in</div>
      <p>Stock analysis and screening tool</p>
      <p>Made in India.</p>
    </div>
  
    <div class="footer-right">
      <div>
        <h4>Product</h4>
        <p id="learn-btn" class="footer-link">Learn</p>
      </div>
      <div>
        <h4>Team</h4>
        <p id="about-btn" class="footer-link">About us</p>
        <p id="support-btn" class="footer-link">Support</p>
      </div>
      <div>
        <h4>Theme</h4>
        <p id="light-theme" class="footer-link">Light</p>
        <p id="dark-theme" class="footer-link">Dark</p>
      </div>
    </div>
  </footer>
  
  <!-- Auth Modals -->
<div class="modal" id="authModal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <div id="authForm">
      <h2 id="formTitle">Login</h2>
      <input type="text" id="authUsername" placeholder="Username" />
      <input type="password" id="authPassword" placeholder="Password" />
      <button id="submitAuth">Submit</button>
      <p id="toggleAuth">Don't have an account? <span id="switchToSignup">Sign up</span></p>
    </div>
  </div>
</div>
<div id="footer-modal" class="modal hidden">
  <div class="modal-content">
    <span id="footer-modal-close" class="close">&times;</span>
    <div id="footer-modal-body"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
